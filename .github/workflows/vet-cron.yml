name: Veterinary Appointment Cron
on:
    schedule:
        - cron: "*/5 * * * *"
    workflow_dispatch: # Allows you to run it manually for testing

jobs:
    check-expired:
        runs-on: ubuntu-latest
        steps:
            - name: Check Expired Appointment
              env:
                  MY_SECRET_VALUE: ${{ secrets.CRON_SECRET }}
              run: |
                  curl -L -X GET "https://www.josephmary.me/api/cron/alert" \
                  -H "Authorization: Bearer $MY_SECRET_VALUE"
